[project]
name = "local-transcriber"
version = "0.1.0"
description = "Private audio and video transcription on Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit==1.66.0",
    "mlx-whisper==0.4.3",
    "pyannote.audio==4.0.7",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "huggingface-hub>=0.28.1,<2",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
